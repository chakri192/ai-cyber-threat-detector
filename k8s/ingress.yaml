apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tsoc-api-ingress
  namespace: tsoc
  # Previously two separate `annotations:` keys in this mapping -- valid
  # per non-strict YAML decoding (last-key-wins), so `kubectl apply`
  # accepted it with no warning while silently dropping the ModSecurity
  # and OWASP Core Rule Set annotations that were in the first (discarded)
  # map. Merged into one block below; every prior annotation is retained.
  annotations:
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/auth-url: "https://auth.tsoc.local/verify"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User,X-Role"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_intercept_errors on;
      error_page 401 403 500 502 503 504 =401 /error-auth;
    # api.tsoc.local is not a real, publicly-resolvable domain, so a public
    # ACME issuer (letsencrypt-prod) could never validate it -- and
    # shouldn't be asked to: this platform sits behind a data diode and is
    # never meant to be internet-facing, so a publicly-trusted cert isn't
    # the right tool regardless. tsoc-internal-ca-issuer (see
    # k8s/cert-manager-internal-ca.yaml) issues from a cluster-local CA
    # instead -- verified end-to-end against a real cert-manager
    # installation (see SECURITY.md).
    cert-manager.io/cluster-issuer: "tsoc-internal-ca-issuer"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "tsoc/client-cert"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.tsoc.local
    secretName: tsoc-api-tls
  rules:
  - host: api.tsoc.local
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: tsoc-api-service
            port:
              number: 80
      - path: /livez
        pathType: Exact
        backend:
          service:
            name: tsoc-api-service
            port:
              number: 80
      - path: /readyz
        pathType: Exact
        backend:
          service:
            name: tsoc-api-service
            port:
              number: 80
